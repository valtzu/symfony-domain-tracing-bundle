services:
  php:
    build:
      context: ./demo
      target: frankenphp_dev
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTP_PORT: "8080"
      APP_ENV: dev
      OTEL_SERVICE_NAME: shop
      TRACING_UI_URL: http://localhost:${TRACING_PORT:-8200}
      PHP_IDE_CONFIG: serverName=symfony-ai-stacktrace
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST:-recorder}
      MERCURE_DIRECTIVES: |
        mercure {
            anonymous
            issuer https://localhost {
                publisher {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
                subscriber {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
            }
        }
      HOT_RELOAD_DIRECTIVES: hot_reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PHP_PORT:-8100}:8080"
    volumes:
      - ./demo:/app
      - ./var/xdebug-traces:/traces
      - caddy_data:/data
      - caddy_config:/config

  payments:
    build:
      context: ./demo
      target: frankenphp_dev
    environment:
      HTTP_PORT: "8080"
      APP_ENV: dev
      OTEL_SERVICE_NAME: payments
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST:-recorder}
    volumes:
      - ./demo:/app
      - ./var/xdebug-traces:/traces

  # The tracing app

  recorder:
    build: .
    command: ["php", "bin/console", "app:record-traces"]
    volumes:
      - ./:/app
      - ./var/xdebug-traces:/traces

  tracing-worker:
    build: .
    command: ["php", "bin/console", "app:process-traces"]
    environment:
      TRACE_GIT_REPOSITORIES: /repositories/shop
      GIT_OPTIONAL_LOCKS: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./:/app
      - ./:/repositories/shop:ro
      - ${CLAUDE_CLI:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_CREDENTIALS:-~/.claude/.credentials.json}:/root/.claude/.credentials.json

  tracing:
    build: .
    environment:
      CADDY_SERVER_EXTRA_DIRECTIVES: header Access-Control-Allow-Origin *
      TRACE_GIT_REPOSITORIES: /repositories/shop
      GIT_OPTIONAL_LOCKS: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    ports:
      - "127.0.0.1:${TRACING_PORT:-8200}:8080"
    volumes:
      - ./:/app
      - ./:/repositories/shop:ro

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

volumes:
  caddy_data:
  caddy_config:
