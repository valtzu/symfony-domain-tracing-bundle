services:
  php:
    build:
      context: .
      target: frankenphp_dev
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTP_PORT: "8080"
      APP_ENV: dev
      PHP_IDE_CONFIG: serverName=symfony-ai-stacktrace
      PHP_DEBUGGER_CLIENT_HOST: ${PHP_DEBUGGER_CLIENT_HOST:-recorder}
      MERCURE_DIRECTIVES: |
        mercure {
            anonymous
            issuer https://localhost {
                publisher {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
                subscriber {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
            }
        }
      HOT_RELOAD_DIRECTIVES: hot_reload
      CADDY_SERVER_EXTRA_DIRECTIVES: request_header X-Request-Id {http.request.uuid}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PHP_PORT:-8100}:8080"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config

  recorder:
    build:
      context: .
      target: frankenphp_dev
    command: ["php", "-d", "php_debugger.mode=off", "bin/console", "app:record-traces", "--step-delay=${RECORDER_STEP_DELAY:-0}"]
    environment:
      APP_ENV: dev
    volumes:
      - ./:/app

volumes:
  caddy_data:
  caddy_config:
