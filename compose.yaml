services:
  php:
    build:
      context: .
      target: frankenphp_dev
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTP_PORT: "8080"
      APP_ENV: dev
      MERCURE_DIRECTIVES: |
        mercure {
            anonymous
            issuer https://localhost {
                publisher {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
                subscriber {
                    jwt {file./app/frankenphp/dev-mercure-secret} HS256
                }
            }
        }
      HOT_RELOAD_DIRECTIVES: hot_reload
    ports:
      - "127.0.0.1:${PHP_PORT:-8100}:8080"
    volumes:
      - ./:/app
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
