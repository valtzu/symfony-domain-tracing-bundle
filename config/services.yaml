services:
    _defaults:
        autowire: true
        autoconfigure: true

    Valtzu\DomainTracingBundle\:
        resource: '../src/'
        exclude:
            - '../src/DomainTracingBundle.php'
            - '../src/Tracing/Resources/'

    Valtzu\DomainTracingBundle\Tracing\TraceDataCollector:
        autoconfigure: false
        # right after the "request" collector, which has priority 335
        tags: [{ name: data_collector, id: domain_traces, template: '@DomainTracing/collector.html.twig', priority: 334 }]

    domain_tracing.platform:
        class: Symfony\AI\Platform\Platform
        # public so that tests can replace it with a mock platform
        public: true
        factory: [Symfony\AI\Platform\Bridge\ClaudeCode\Factory, createPlatform]
        arguments:
            $workingDirectory: '%kernel.project_dir%/var'
            $timeout: 600
