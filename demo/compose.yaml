name: symfony-ai-stacktrace

services:
  shop:
    build:
      context: .
      target: frankenphp_dev
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTP_PORT: "8080"
      APP_ENV: dev
      OTEL_SERVICE_NAME: shop
      PHP_IDE_CONFIG: serverName=symfony-ai-stacktrace
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST:-tracing}
      MERCURE_DIRECTIVES: |
        mercure {
            anonymous
            issuer https://localhost {
                publisher {
                    jwt {file./app/demo/frankenphp/dev-mercure-secret} HS256
                }
                subscriber {
                    jwt {file./app/demo/frankenphp/dev-mercure-secret} HS256
                }
            }
        }
      HOT_RELOAD_DIRECTIVES: hot_reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PHP_PORT:-8100}:8080"
    working_dir: /app/demo
    volumes:
      - ../:/app
      - traces:/app/demo/var/share/traces
      - caddy_data:/data
      - caddy_config:/config

  payments:
    build:
      context: .
      target: frankenphp_dev
    environment:
      HTTP_PORT: "8080"
      APP_ENV: dev
      OTEL_SERVICE_NAME: payments
      XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST:-tracing}
    working_dir: /app/demo
    volumes:
      - ../:/app
      - traces:/app/demo/var/share/traces

  # Records the requests of the services above, and names and describes them with Claude Code
  tracing:
    build:
      context: .
      target: frankenphp_dev
    command: ["php", "bin/console", "ai-stacktrace:run"]
    environment:
      APP_ENV: dev
      XDEBUG_MODE: "off"
      TRACE_GIT_REPOSITORIES: /app
      GIT_OPTIONAL_LOCKS: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    working_dir: /app/demo
    volumes:
      - ../:/app
      - traces:/app/demo/var/share/traces
      - ${CLAUDE_CLI:-~/.local/bin/claude}:/usr/local/bin/claude:ro
      - ${CLAUDE_CREDENTIALS:-~/.claude/.credentials.json}:/root/.claude/.credentials.json

volumes:
  caddy_data:
  caddy_config:
  traces:
