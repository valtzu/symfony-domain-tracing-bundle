[xdebug]
xdebug.mode=trace,coverage,debug
xdebug.start_with_request=yes
xdebug.trace_format=1
xdebug.collect_return=1
xdebug.output_dir=/app/demo/var/share/traces
xdebug.trace_output_name=trace.%t.%r
xdebug.var_display_max_depth=2
xdebug.var_display_max_children=16
xdebug.var_display_max_data=256
auto_prepend_file=/app/resources/xdebug-prepend.php
