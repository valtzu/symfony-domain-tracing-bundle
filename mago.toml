# Mago only looks for bugs, such as a null or false that is not handled, an undefined variable or a call to a method
# that does not exist. How the code is written and organized is not its job: PHP_CodeSniffer checks the style.
php-version = "8.4"

[source]
paths = ["src", "tests", "config"]
includes = ["vendor"]
excludes = ["config/reference.php"]

[analyzer]
analyze-dead-code = true
check-property-initialization = true
check-use-statements = true
class-initializers = ["setUp"]
minimum-fail-level = "warning"
# A value of unknown type, such as one decoded from JSON, is not a bug by itself
ignore = [
    "mixed-argument",
    "mixed-array-access",
    "mixed-array-assignment",
    "mixed-array-index",
    "mixed-assignment",
    "mixed-method-access",
    "mixed-operand",
    "mixed-property-access",
    "mixed-property-type-coercion",
    "mixed-return-statement",
    # preg_match() and similar functions define the variable that they get by reference
    "reference-to-undefined-variable",
    # Symfony sets the private properties of a bundle when it needs them
    { code = "missing-constructor", in = ["src/DomainTracingBundle.php"] },
]
